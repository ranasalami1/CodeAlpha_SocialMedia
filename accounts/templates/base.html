{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Connectly
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="{% url 'feed' %}" class="brand">
            Connectly
        </a>

        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'feed' %}">
                    Feed
                </a>

                <a href="{% url 'create_post' %}">
                    Create
                </a>

                <a href="{% url 'profile' %}">
                    Profile
                </a>

                <form
                    method="POST"
                    action="{% url 'logout' %}"
                    class="logout-form"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="logout-btn"
                    >
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>


<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
