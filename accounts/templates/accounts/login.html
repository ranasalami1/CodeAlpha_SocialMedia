{% extends "base.html" %}


{% block title %}
Login | Connectly
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue to Connectly.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create one
            </a>

        </div>

    </div>

</div>

{% endblock %}
