{% extends "base.html" %}


{% block title %}
Create Post | Connectly
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        Create a Post
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Publish Post
        </button>

        <a
            href="{% url 'feed' %}"
            class="btn btn-light"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
